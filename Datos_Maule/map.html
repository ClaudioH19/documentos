// --- Grilla octaédrica aproximada (mostrar solo en HTML, no guardar) ---
function addOctaLikeGrid(spacing_km) {
    // Usar los bounds actuales del mapa con un pequeño padding
    var pad_deg = 0.1; // padding en grados para asegurar cobertura
    var b = map_94a1e8841b02cc12b902ed2547417834.getBounds();
    var south = b.getSouth() - pad_deg;
    var north = b.getNorth() + pad_deg;
    var west = b.getWest() - pad_deg;
    var east = b.getEast() + pad_deg;

    var meanLat = (north + south) / 2.0;
    // Aproximación: 1 grado lat ~ 111.32 km
    var dlat = spacing_km / 111.32;
    // Lon depende de lat (usamos la lat media para aproximar)
    var dlon = spacing_km / (111.32 * Math.cos(meanLat * Math.PI / 180.0));

    var rows = [];
    var maxCols = 0;
    var rowIndex = 0;
    for (var lat = south; lat <= north + 1e-8; lat += dlat) {
        var offset = (rowIndex % 2) ? dlon / 2.0 : 0.0; // alternar para aproximar empaquetado
        var rowPoints = [];
        for (var lon = west + offset; lon <= east + 1e-8; lon += dlon) {
            rowPoints.push([lat, lon]);
            if (rowPoints.length > 10000) break;
        }
        rows.push(rowPoints);
        maxCols = Math.max(maxCols, rowPoints.length);
        rowIndex += 1;
        if (rows.length > 1000) break; // seguridad
    }

    var gridLayer = L.layerGroup();

    // Dibujar líneas horizontales (filas)
    rows.forEach(function(r) {
        if (r.length > 1) {
            L.polyline(r, {color: '#1f78b4', weight: 1, opacity: 0.9}).addTo(gridLayer);
        }
    });

    // Dibujar líneas 'verticales' aproximadas conectando puntos columna a columna
    for (var c = 0; c < maxCols; c++) {
        var colPts = [];
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            if (r.length === 0) continue;
            // calcular lon objetivo según columna y posible offset de fila
            var rowOffset = (i % 2) ? dlon / 2.0 : 0.0;
            var targetLon = west + c * dlon + rowOffset;
            // buscar el punto más cercano en la fila
            var best = null;
            var bestDiff = 1e9;
            for (var k = 0; k < r.length; k++) {
                var diff = Math.abs(r[k][1] - targetLon);
                if (diff < bestDiff) { bestDiff = diff; best = r[k]; }
            }
            if (best) colPts.push(best);
        }
        if (colPts.length > 1) {
            L.polyline(colPts, {color: '#1f78b4', weight: 1, opacity: 0.9}).addTo(gridLayer);
        }
    }

    // Añadir la capa al mapa (por defecto visible)
    gridLayer.addTo(map_94a1e8841b02cc12b902ed2547417834);

    // Añadir control de capas para poder activarla/desactivarla
    var overlays = {};
    overlays['Octa-grid 9km'] = gridLayer;
    L.control.layers(null, overlays, {collapsed: false}).addTo(map_94a1e8841b02cc12b902ed2547417834);
}

// Esperar que el mapa esté listo y luego generar la grilla
map_94a1e8841b02cc12b902ed2547417834.whenReady(function() {
    // Valor por defecto 9 km
    addOctaLikeGrid(9);
});
